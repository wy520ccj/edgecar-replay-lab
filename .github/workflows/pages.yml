name: Publish replay report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release --parallel
      - name: Generate report
        run: |
          mkdir -p out/pages
          build/release/bin/edgecar-replay --scenario scenarios/03_s_curve_nominal.yaml --output out/pages/demo
          build/release/bin/edgecar-report --telemetry out/pages/demo/telemetry.v1.jsonl --output out/pages/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/pages
      - id: deployment
        uses: actions/deploy-pages@v4
